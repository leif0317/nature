<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>太陽系模擬｜3D動態光影版｜小粘製作</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100%; font-family: "Microsoft JhengHei", sans-serif; }
  /* 背景星空 */
  body { background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/89/HD.15.039.jpg'); background-size: cover; background-position: center; }
  
  /* 右下角署名 */
  #credits {
    position: fixed; bottom: 10px; right: 15px;
    color: rgba(255, 255, 255, 0.4); 
    font-size: 13px; pointer-events: none; z-index: 10;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8); font-weight: 300;
  }

  /* --- 控制面板樣式 --- */
  .controls {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 20;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px 20px;
    border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    align-items: center; 
  }
  
  .btn-group { display: flex; gap: 5px; align-items: center; }
  .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.3); margin: 0 5px; }
  
  button {
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff; padding: 8px 16px; border-radius: 20px;
    font-size: 14px; cursor: pointer; transition: all 0.2s ease; outline: none;
    user-select: none; min-width: 40px; display: flex; align-items: center; justify-content: center;
    white-space: nowrap; 
  }
  button:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
  button:active { transform: scale(0.95) translateY(0); }
  button.circle { border-radius: 50%; padding: 0; width: 36px; height: 36px; font-weight: bold; font-size: 18px; }
  button.active { background: rgba(74, 163, 255, 0.6); border-color: #4aa3ff; box-shadow: 0 0 10px rgba(74, 163, 255, 0.4); }
  #btn-reset:hover { background: rgba(255, 80, 80, 0.4); border-color: #ff5050; }

  /* 滑動桿樣式 */
  .slider-container { display: flex; align-items: center; margin: 0 8px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 70px; height: 6px;
    background: rgba(255, 255, 255, 0.2); border-radius: 3px; outline: none; transition: opacity .2s;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    background: #fff; cursor: pointer; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; background: #fff; cursor: pointer;
    border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.5); border: none;
  }

  canvas { display: block; }
</style>
</head>
<body>

<div id="credits">小粘製作</div>

<div class="controls">
  <div class="btn-group">
    <button id="btn-zoom-out" class="circle" title="縮小">－</button>
    <button id="btn-zoom-in" class="circle" title="放大">＋</button>
    <button id="btn-reset" title="還原初始狀態">↺ 重置</button>
  </div>
  
  <div class="divider"></div>

  <div class="btn-group">
    <button id="btn-comet" class="active" title="顯示/隱藏彗星">☄️</button>
    <div class="slider-container" title="調整彗星大小">
      <input type="range" id="comet-size-slider" min="0.5" max="3.0" step="0.1" value="1">
    </div>
    <button id="btn-orbit" title="開始/暫停公轉">🪐 公轉</button>
  </div>
</div>

<canvas id="cv"></canvas>

<script>
(function(){
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  
  // DOM 元素
  const btnComet = document.getElementById('btn-comet');
  const btnOrbit = document.getElementById('btn-orbit');
  const btnZoomIn = document.getElementById('btn-zoom-in');
  const btnZoomOut = document.getElementById('btn-zoom-out');
  const btnReset = document.getElementById('btn-reset');
  const cometSizeSlider = document.getElementById('comet-size-slider');

  let w = 0, h = 0, cx = 0, cy = 0;
  
  // 視圖控制變數
  let scale = 1.0;          
  const SCALE_STEP = 0.2;   
  const MIN_SCALE = 0.4;    
  const MAX_SCALE = 2.5;    

  // 狀態控制變數
  let isCometVisible = true;
  let isOrbiting = false; 
  let cometScale = 1.0;

  // --- 全新設計：3D 漸層行星數據 ---
  // 不再依賴外部圖片，改用高光(light)與暗部(dark)顏色來繪製立體球體
  const planetsData = [
    { name: '水星', size: 2.5, speed: 0.040, angle: 0, light: '#b3b3b3', dark: '#333333' },
    { name: '金星', size: 4.0, speed: 0.025, angle: 0, light: '#f2d08a', dark: '#8a6d2b' },
    { name: '地球', size: 4.2, speed: 0.020, angle: 0, light: '#6bafff', dark: '#002b70' },
    { name: '火星', size: 3.0, speed: 0.016, angle: 0, light: '#ff8966', dark: '#8a2200' },
    { name: '木星', size: 10.0, speed: 0.008, angle: 0, light: '#e8cd97', dark: '#705930' },
    { name: '土星', size: 8.5, speed: 0.006, angle: 0, light: '#e3d091', dark: '#6e5f30' },
    { name: '天王星', size: 6.0, speed: 0.004, angle: 0, light: '#a8e7ff', dark: '#247399' },
    { name: '海王星', size: 5.8, speed: 0.003, angle: 0, light: '#6b89ff', dark: '#162a7a' }
  ];

  // 小行星帶數據
  const asteroids = [];
  const ASTEROID_COUNT = 800;
  let asteroidAngleOffset = 0; 
  
  function initAsteroids() {
    asteroids.length = 0;
    for(let i=0; i<ASTEROID_COUNT; i++) {
      asteroids.push({
        angle: Math.random() * Math.PI * 2,
        rFactor: Math.random(), 
        size: Math.random() * 1.5 + 0.5, 
        opacity: Math.random() * 0.5 + 0.3
      });
    }
  }
  initAsteroids();

  // 彗星軌道參數
  const startTheta = Math.PI * 1.8; 
  const endTheta = Math.PI * 0.2;   
  let theta = startTheta; 
  const e = 0.88; 

  // --- 事件綁定 ---
  btnZoomIn.addEventListener('click', () => { scale = Math.min(scale + SCALE_STEP, MAX_SCALE); });
  btnZoomOut.addEventListener('click', () => { scale = Math.max(scale - SCALE_STEP, MIN_SCALE); });
  cometSizeSlider.addEventListener('input', (e) => { cometScale = parseFloat(e.target.value); });

  btnReset.addEventListener('click', () => {
    scale = 1.0;
    theta = startTheta;
    planetsData.forEach(p => p.angle = 0);
    asteroidAngleOffset = 0;
    isOrbiting = false;
    btnOrbit.classList.remove('active');
    isCometVisible = true;
    btnComet.classList.add('active');
    cometScale = 1.0;
    cometSizeSlider.value = "1";
  });

  btnComet.addEventListener('click', () => {
    isCometVisible = !isCometVisible;
    btnComet.classList.toggle('active', isCometVisible);
  });

  btnOrbit.addEventListener('click', () => {
    isOrbiting = !isOrbiting;
    btnOrbit.classList.toggle('active', isOrbiting);
  });

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    cx = w / 2;
    cy = h / 2;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw() {
    if (w === 0 || h === 0) { requestAnimationFrame(draw); return; }

    ctx.clearRect(0, 0, w, h);

    // 縮放矩陣
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);

    const sunRadius = 45;
    const maxRadius = Math.min(w, h) / 2;
    const gap = Math.max(35, (maxRadius - sunRadius - 20) / planetsData.length);

    // 畫太陽
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, sunRadius + 5);
    g.addColorStop(0, 'rgba(255, 240, 150, 1)');
    g.addColorStop(0.2, 'rgba(255, 200, 50, 0.9)');
    g.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, sunRadius + 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fffab0';
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fill();

    // 畫軌道線 & 行星
    for (let i = 0; i < planetsData.length; i++) {
      const p = planetsData[i];
      const orbitR = sunRadius + 20 + (i * gap);

      // 畫軌道線
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1 / scale; 
      ctx.beginPath();
      ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
      ctx.stroke();

      // 小行星帶
      if (i === 3) {
        const rStart = orbitR + gap * 0.3;
        const rEnd = orbitR + gap * 0.7;
        const beltWidth = rEnd - rStart;

        ctx.fillStyle = '#888';
        for (let a of asteroids) {
          const currentA = a.angle + asteroidAngleOffset;
          const r = rStart + a.rFactor * beltWidth;
          const ax = cx + r * Math.cos(currentA);
          const ay = cy + r * Math.sin(currentA);

          ctx.globalAlpha = a.opacity;
          ctx.beginPath();
          ctx.arc(ax, ay, a.size, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;
      }

      // --- 動態光影 3D 繪製行星 ---
      const planetX = cx + orbitR * Math.cos(p.angle);
      const planetY = cy + orbitR * Math.sin(p.angle);

      // 計算從行星指向太陽的角度 (光源方向)
      const angleToSun = Math.atan2(cy - planetY, cx - planetX);
      
      // 光暈高光點會往太陽的方向偏移
      const highlightX = planetX + Math.cos(angleToSun) * (p.size * 0.4);
      const highlightY = planetY + Math.sin(angleToSun) * (p.size * 0.4);

      // 建立 3D 徑向漸層
      const planetGrad = ctx.createRadialGradient(
        highlightX, highlightY, 0,           // 亮點起點
        planetX, planetY, p.size             // 球體邊緣暗點
      );
      planetGrad.addColorStop(0, p.light);   // 亮面顏色
      planetGrad.addColorStop(1, p.dark);    // 暗面顏色

      ctx.fillStyle = planetGrad;
      ctx.beginPath();
      ctx.arc(planetX, planetY, p.size, 0, Math.PI * 2);
      ctx.fill();

      // 公轉更新
      if (isOrbiting) p.angle -= p.speed;
    }

    if (isOrbiting) asteroidAngleOffset -= 0.002;

    // 畫彗星
    if (isCometVisible) {
      const perihelionDist = sunRadius + 15;
      const a = perihelionDist / (1 - e);
      const r_comet = (a * (1 - e * e)) / (1 - e * Math.cos(theta)); 
      
      const x = cx + r_comet * Math.cos(theta);
      const y = cy + r_comet * Math.sin(theta);
      
      const dx = x - cx;
      const dy = y - cy;
      const safeDist = Math.max(Math.sqrt(dx*dx + dy*dy), 1);

      const baseTailWidth = 2.5;
      const baseNucleusSize = 2.5;
      const baseTailLen = Math.min(60, 1200 / safeDist);
      const tailLen = baseTailLen * cometScale; 

      const tx = x + (dx / safeDist) * tailLen;
      const ty = y + (dy / safeDist) * tailLen;
      
      const grad = ctx.createLinearGradient(x, y, tx, ty);
      grad.addColorStop(0, 'rgba(200, 230, 255, 0.9)');
      grad.addColorStop(1, 'rgba(200, 230, 255, 0)');
      
      ctx.strokeStyle = grad;
      ctx.lineWidth = (baseTailWidth * cometScale) / scale; 
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x, y, baseNucleusSize * cometScale, 0, Math.PI * 2);
      ctx.fill();

      let speed = 0.004 * (a / safeDist);
      theta -= speed; 
      if (theta < endTheta) theta = startTheta;
    }

    ctx.restore();
    requestAnimationFrame(draw);
  }

  // 初始化執行
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);

})();
</script>
</body>
</html>
