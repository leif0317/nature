<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位移與路徑長 - 國中理化</title>
    <style>
        /* 網頁基本字體與背景設定 */
        body {
            font-family: '微軟正黑體', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        /* 右上角專屬署名 */
        .signature {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff6b6b;
            padding: 8px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            letter-spacing: 2px;
            z-index: 10;
        }

        h1 {
            margin-top: 60px;
            color: #2c3e50;
        }

        /* 顯示數值的看板區塊 */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }

        .box {
            background: white;
            padding: 20px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            font-size: 22px;
            font-weight: bold;
            min-width: 150px;
        }

        .value {
            display: block;
            font-size: 48px;
            margin-top: 10px;
        }

        #displacementValue { color: #007bff; } /* 位移用藍色表示 */
        #distanceValue { color: #dc3545; }    /* 路徑長用紅色表示 */

        /* 軌道區塊 */
        .track-container {
            margin: 100px auto 50px auto;
            width: 80%;
            max-width: 800px;
            position: relative;
        }

        /* 隱藏預設的滑動條外觀，重新設計成軌道與人 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            position: relative;
            z-index: 2;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* 軌道設計 */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 12px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 6px;
            border: 1px solid #94a3b8;
        }

        /* 操作的控制點（代表「人」） */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 40px;
            width: 40px;
            background-color: #f1c40f;
            border: 3px solid #34495e;
            border-radius: 50%;
            cursor: pointer;
            margin-top: -15px; /* 讓控制點垂直置中於軌道 */
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            /* 加上一個可愛的行人 emoji 作為背景 */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="60">🚶</text></svg>');
            background-size: cover;
            background-position: center;
        }

        /* 座標軸刻度 */
        .axis {
            display: flex;
            justify-content: space-between;
            position: absolute;
            width: 100%;
            top: 30px; /* 調整刻度在軌道下方的位置 */
            color: #555;
            font-weight: bold;
            font-size: 18px;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 1;
        }

        .axis span {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .axis span::before {
            content: '|';
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 14px;
        }

        /* 重置按鈕 */
        button {
            margin-top: 30px;
            padding: 12px 40px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover { background-color: #27ae60; }
        button:active { transform: scale(0.96); }
        
        .description {
            margin-top: 20px;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="signature">小粘製作</div>

    <h1>🏃‍♂️ 1D 直線運動：位移與路徑長</h1>
    
    <div class="description">請左右拖曳軌道上的小人，觀察上方數值的變化。</div>

    <div class="scoreboard">
        <div class="box">
            位移<br><span style="font-size: 16px; color: #666; font-weight: normal;">(Displacement)</span>
            <span class="value" id="displacementValue">0</span>
        </div>
        <div class="box">
            路徑長<br><span style="font-size: 16px; color: #666; font-weight: normal;">(Distance)</span>
            <span class="value" id="distanceValue">0</span>
        </div>
    </div>

    <div class="track-container">
        <input type="range" id="personSlider" min="-100" max="100" value="0">
        
        <div class="axis">
            <span>-100</span>
            <span>-50</span>
            <span>0</span>
            <span>50</span>
            <span>100</span>
        </div>
    </div>

    <button id="resetBtn">🔄 重置 (Reset)</button>

    <script>
        // 取得網頁元素
        const slider = document.getElementById('personSlider');
        const dispDisp = document.getElementById('displacementValue');
        const distDisp = document.getElementById('distanceValue');
        const resetBtn = document.getElementById('resetBtn');

        // 宣告並初始化變數
        const initialPosition = 0; // 初始位置永遠為 0
        let lastPosition = 0;      // 記錄上一個瞬間的位置，用來計算路徑長
        let totalDistance = 0;     // 累積的路徑長

        // 監聽滑動條(人)移動的事件
        slider.addEventListener('input', function() {
            // 取得當前人的座標位置 (轉為整數)
            let currentPos = parseInt(this.value);

            // 【計算位移】：目前位置 - 初始位置
            let displacement = currentPos - initialPosition;

            // 【計算路徑長】：累加每次移動的絕對值 (目前位置與上一個位置的差值)
            let moveDelta = Math.abs(currentPos - lastPosition);
            totalDistance += moveDelta;

            // 更新上一個位置，供下次計算使用
            lastPosition = currentPos;

            // 將數值更新到畫面上
            // 如果位移為正，可以考慮加上 '+' 號讓方向更清楚
            dispDisp.innerText = displacement > 0 ? '+' + displacement : displacement;
            distDisp.innerText = totalDistance;
        });

        // 監聽重置按鈕點擊事件
        resetBtn.addEventListener('click', function() {
            // 所有數值歸零
            slider.value = 0;
            lastPosition = 0;
            totalDistance = 0;
            
            // 畫面顯示歸零
            dispDisp.innerText = '0';
            distDisp.innerText = '0';
        });
    </script>

</body>
</html>
