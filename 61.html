<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位移與路徑長綜合模擬 - 國中理化</title>
    <style>
        body {
            font-family: '微軟正黑體', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            user-select: none;
        }

        /* 署名 */
        .signature {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff6b6b;
            padding: 8px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            letter-spacing: 2px;
            z-index: 100;
        }

        h1 { margin-top: 40px; color: #2c3e50; }
        .description { color: #666; font-size: 16px; margin-bottom: 20px; }

        /* 計分板 */
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        .box {
            background: white;
            padding: 15px 35px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            font-size: 20px;
            font-weight: bold;
            min-width: 150px;
        }
        .value { display: block; font-size: 38px; margin-top: 5px; }
        #displacementValue { color: #007bff; }
        #distanceValue { color: #dc3545; }

        /* 主佈局：左側選單，右側內容 */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 側邊欄頁籤按鈕 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 180px;
        }
        .tab-btn {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #cbd5e1;
            background-color: #f8fafc;
            border-radius: 8px;
            transition: 0.3s;
            width: 100%;
        }
        .tab-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        /* 右側操作區容器 */
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        /* 各區塊 */
        .mode-container { display: none; width: 100%; position: relative; }
        .mode-container.active { display: block; }

        /* --- 模式 1: 直線 --- */
        .track-container { margin: 60px auto 40px auto; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; z-index: 2; position: relative; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 12px; cursor: pointer; background: #cbd5e1; border-radius: 6px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 40px; width: 40px; background-color: #f1c40f;
            border: 3px solid #34495e; border-radius: 50%; cursor: pointer; margin-top: -15px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="60">🚶</text></svg>');
            background-size: cover; background-position: center; box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .axis { display: flex; justify-content: space-between; position: absolute; width: 100%; top: 30px; color: #555; font-weight: bold; z-index: 1; }
        .axis span { display: flex; flex-direction: column; align-items: center; }
        .axis span::before { content: '|'; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }

        /* --- 模式 2: 圓形 --- */
        .circle-controls { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;}
        .circle-controls button {
            padding: 8px 15px; font-size: 16px; cursor: pointer; background-color: #e2e8f0; border: none; border-radius: 6px; font-weight: bold;
        }
        .circle-controls button:hover { background-color: #cbd5e1; }
        canvas { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: crosshair; }

        /* 重置按鈕 */
        .reset-btn {
            margin-top: 30px; padding: 12px 40px; font-size: 20px; font-weight: bold; cursor: pointer;
            background-color: #2ecc71; color: white; border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: 0.2s;
        }
        .reset-btn:hover { background-color: #27ae60; }
        .reset-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="signature">小粘製作</div>

    <h1>🏃‍♂️ 運動學：位移與路徑長</h1>
    
    <div class="scoreboard">
        <div class="box">
            位移 <br><span style="font-size: 14px; color: #666; font-weight: normal;">(藍色虛線)</span>
            <span class="value" id="displacementValue">0</span>
        </div>
        <div class="box">
            路徑長 <br><span style="font-size: 14px; color: #666; font-weight: normal;">(紅色實線)</span>
            <span class="value" id="distanceValue">0</span>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <button class="tab-btn active" onclick="switchMode('1d', this)">1D 直線運動</button>
            <button class="tab-btn" onclick="switchMode('circle', this)">圓形軌道</button>
            <button class="tab-btn" onclick="switchMode('2d', this)">2D 平面座標</button>
        </div>

        <div class="content-area">
            
            <div id="mode-1d" class="mode-container active">
                <div class="description">左右拖曳小人，觀察正負位移。</div>
                <div class="track-container">
                    <input type="range" id="personSlider" min="-100" max="100" value="0">
                    <div class="axis">
                        <span>-100</span><span>-50</span><span>0</span><span>50</span><span>100</span>
                    </div>
                </div>
            </div>

            <div id="mode-circle" class="mode-container">
                <div class="description">點擊按鈕 (半徑=100)，或直接在畫布上按住拖曳。</div>
                <div class="circle-controls">
                    <button onclick="setCircleFraction(1, '0', '200π')">一圈</button>
                    <button onclick="setCircleFraction(1/2, '200', '100π')">1/2 圈</button>
                    <button onclick="setCircleFraction(1/3, '100√3', '200π/3')">1/3 圈</button>
                    <button onclick="setCircleFraction(1/4, '100√2', '50π')">1/4 圈</button>
                    <button onclick="setCircleFraction(1/6, '100', '100π/3')">1/6 圈</button>
                </div>
                <canvas id="circleCanvas" width="400" height="300"></canvas>
            </div>

            <div id="mode-2d" class="mode-container">
                <div class="description">在方格內「按住滑鼠拖曳」畫出路徑。</div>
                <canvas id="planeCanvas" width="400" height="300"></canvas>
            </div>

            <button class="reset-btn" onclick="resetCurrentMode()">🔄 重置 (Reset)</button>
        </div>
    </div>

    <script>
        // --- 共用 UI ---
        const dispEl = document.getElementById('displacementValue');
        const distEl = document.getElementById('distanceValue');
        let currentMode = '1d';

        function updateScore(disp, dist, useSign = false) {
            if (useSign && typeof disp === 'number' && disp > 0) {
                dispEl.innerText = '+' + disp;
            } else {
                dispEl.innerText = disp;
            }
            distEl.innerText = dist;
        }

        function switchMode(mode, btnEl) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnEl.classList.add('active');
            document.querySelectorAll('.mode-container').forEach(div => div.classList.remove('active'));
            document.getElementById('mode-' + mode).classList.add('active');
            currentMode = mode;
            resetCurrentMode();
        }

        function resetCurrentMode() {
            if (currentMode === '1d') reset1D();
            else if (currentMode === 'circle') resetCircle();
            else if (currentMode === '2d') reset2D();
        }

        // --- 模式 1: 1D 直線 ---
        const slider = document.getElementById('personSlider');
        let lastPos1D = 0, totalDist1D = 0;
        slider.addEventListener('input', function() {
            let currentPos = parseInt(this.value);
            let disp = currentPos; 
            totalDist1D += Math.abs(currentPos - lastPos1D);
            lastPos1D = currentPos;
            updateScore(disp, totalDist1D, true);
        });
        function reset1D() {
            slider.value = 0; lastPos1D = 0; totalDist1D = 0; updateScore(0, 0, true);
        }

        // --- 模式 2: 圓形軌道 ---
        const cCanvas = document.getElementById('circleCanvas');
        const cCtx = cCanvas.getContext('2d');
        const R = 100, cx = 200, cy = 150;
        let cAngle = 0, cTotalAngle = 0, cDragging = false;
        let exactDisp = null, exactDist = null; 

        function drawCircleScene() {
            cCtx.clearRect(0, 0, 400, 300);
            cCtx.beginPath(); cCtx.arc(cx, cy, R, 0, 2 * Math.PI);
            cCtx.strokeStyle = '#cbd5e1'; cCtx.lineWidth = 4; cCtx.stroke();
            
            cCtx.beginPath(); cCtx.arc(cx, cy, R, 0, cAngle, cAngle < 0);
            cCtx.strokeStyle = '#dc3545'; cCtx.lineWidth = 6; cCtx.stroke();
            
            cCtx.beginPath(); cCtx.moveTo(cx + R, cy);
            cCtx.lineTo(cx + R * Math.cos(cAngle), cy + R * Math.sin(cAngle));
            cCtx.strokeStyle = '#007bff'; cCtx.lineWidth = 2; cCtx.setLineDash([5, 5]); cCtx.stroke();
            cCtx.setLineDash([]);
            
            cCtx.beginPath(); cCtx.arc(cx + R, cy, 5, 0, 2 * Math.PI); cCtx.fillStyle = 'green'; cCtx.fill();
            
            cCtx.beginPath(); cCtx.arc(cx + R * Math.cos(cAngle), cy + R * Math.sin(cAngle), 12, 0, 2 * Math.PI);
            cCtx.fillStyle = '#f1c40f'; cCtx.fill(); cCtx.stroke();
        }

        function setCircleFraction(fraction, dispStr, distStr) {
            cAngle = fraction * 2 * Math.PI; cTotalAngle = cAngle;
            exactDisp = dispStr; exactDist = distStr;
            drawCircleScene(); updateScore(exactDisp, exactDist);
        }

        function calcCircleScore() {
            let dist = (cTotalAngle * R).toFixed(1);
            let disp = (2 * R * Math.sin(Math.abs(cAngle) / 2)).toFixed(1);
            if (Math.abs(cAngle % (2 * Math.PI)) < 0.01 && cTotalAngle > 0) disp = 0; 
            updateScore(disp, dist);
        }

        cCanvas.addEventListener('mousedown', () => cDragging = true);
        window.addEventListener('mouseup', () => cDragging = false);
        cCanvas.addEventListener('mousemove', (e) => {
            if (!cDragging) return;
            exactDisp = null; exactDist = null;
            const rect = cCanvas.getBoundingClientRect();
            let newAngle = Math.atan2(e.clientY - rect.top - cy, e.clientX - rect.left - cx);
            if (newAngle < 0) newAngle += 2 * Math.PI; 
            
            let delta = newAngle - (cAngle % (2 * Math.PI));
            if (delta > Math.PI) delta -= 2 * Math.PI;
            if (delta < -Math.PI) delta += 2 * Math.PI;
            
            cTotalAngle += Math.abs(delta); cAngle += delta;
            drawCircleScene(); calcCircleScore();
        });

        function resetCircle() { cAngle = 0; cTotalAngle = 0; drawCircleScene(); updateScore(0, 0); }

        // --- 模式 3: 2D 平面座標 ---
        const pCanvas = document.getElementById('planeCanvas');
        const pCtx = pCanvas.getContext('2d');
        let pDragging = false, pPoints = [], pTotalDist = 0;

        function drawGrid() {
            pCtx.strokeStyle = '#e2e8f0'; pCtx.lineWidth = 1;
            for(let i=0; i<=400; i+=20) { pCtx.beginPath(); pCtx.moveTo(i,0); pCtx.lineTo(i,300); pCtx.stroke(); }
            for(let i=0; i<=300; i+=20) { pCtx.beginPath(); pCtx.moveTo(0,i); pCtx.lineTo(400,i); pCtx.stroke(); }
        }

        function drawPlaneScene() {
            pCtx.clearRect(0, 0, 400, 300); drawGrid();
            if (pPoints.length === 0) return;

            pCtx.beginPath(); pCtx.moveTo(pPoints[0].x, pPoints[0].y);
            for(let i = 1; i < pPoints.length; i++) pCtx.lineTo(pPoints[i].x, pPoints[i].y);
            pCtx.strokeStyle = '#dc3545'; pCtx.lineWidth = 3; pCtx.stroke();

            const startP = pPoints[0], currP = pPoints[pPoints.length - 1];
            pCtx.beginPath(); pCtx.moveTo(startP.x, startP.y); pCtx.lineTo(currP.x, currP.y);
            pCtx.strokeStyle = '#007bff'; pCtx.lineWidth = 2; pCtx.setLineDash([5, 5]); pCtx.stroke();
            pCtx.setLineDash([]); 

            pCtx.beginPath(); pCtx.arc(startP.x, startP.y, 6, 0, 2*Math.PI); pCtx.fillStyle = 'green'; pCtx.fill();
            pCtx.beginPath(); pCtx.arc(currP.x, currP.y, 6, 0, 2*Math.PI); pCtx.fillStyle = '#f1c40f'; pCtx.fill(); pCtx.stroke();
        }

        pCanvas.addEventListener('mousedown', (e) => {
            const rect = pCanvas.getBoundingClientRect();
            pPoints = [{x: e.clientX - rect.left, y: e.clientY - rect.top}];
            pTotalDist = 0; pDragging = true; drawPlaneScene(); updateScore(0, 0);
        });

        pCanvas.addEventListener('mousemove', (e) => {
            if (!pDragging) return;
            const rect = pCanvas.getBoundingClientRect();
            let currX = e.clientX - rect.left, currY = e.clientY - rect.top;
            let lastP = pPoints[pPoints.length - 1];
            
            pTotalDist += Math.sqrt(Math.pow(currX - lastP.x, 2) + Math.pow(currY - lastP.y, 2));
            pPoints.push({x: currX, y: currY});
            
            drawPlaneScene();
            let startP = pPoints[0];
            let disp = Math.sqrt(Math.pow(currX - startP.x, 2) + Math.pow(currY - startP.y, 2));
            updateScore(disp.toFixed(1), pTotalDist.toFixed(1));
        });

        window.addEventListener('mouseup', () => pDragging = false);

        function reset2D() {
            pPoints = []; pTotalDist = 0; pDragging = false;
            pCtx.clearRect(0, 0, 400, 300); drawGrid(); updateScore(0, 0);
        }

        // 初始化
        resetCurrentMode();

    </script>
</body>
</html>
