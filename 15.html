<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛明亮版元素週期表 ✨ - 小粘製作</title>
    <style>
        /* --- 1. 全域可愛設定 --- */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');

        :root {
            --bg-color: #f4f7f8;
            --card-bg: #ffffff;
            --text-main: #555555;
            --text-muted: #888888;
            --highlight: #ff9a9e;
            --success: #4ade80;
            --error: #f87171;
        }

        body {
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2eafc 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- 2. 頂部導航與署名 --- */
        header {
            width: 100%;
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-title { display: flex; align-items: center; gap: 15px; }
        h1 { margin: 0; font-size: 1.8rem; color: #444; letter-spacing: 2px; }

        /* ✨ 小粘製作 專屬署名樣式 */
        .author-badge {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: white;
            font-size: 0.9rem;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
            letter-spacing: 1px;
            border: 2px solid #fff;
            transform: rotate(-3deg);
            transition: 0.3s;
        }
        .author-badge:hover { transform: rotate(0deg) scale(1.1); }

        /* 模式切換按鈕區 */
        .mode-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        
        .mode-btn {
            background: #f0f4f8; border: 2px solid transparent; padding: 8px 16px;
            border-radius: 20px; font-size: 0.95rem; font-weight: bold; color: #555;
            cursor: pointer; transition: 0.2s;
        }
        .mode-btn:hover { background: #e2eafc; }
        .mode-btn.active {
            background: var(--highlight); color: white;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
        }

        /* --- 3. 週期表佈局 --- */
        .table-wrapper {
            padding: 30px 20px; overflow-x: auto; width: 100%;
            display: flex; justify-content: center; padding-bottom: 60px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 66px);
            grid-template-rows: repeat(10, 66px);
            gap: 8px; position: relative; transition: opacity 0.3s;
        }

        /* --- 4. 元素方塊 --- */
        .element {
            background-color: var(--card-bg); border-radius: 14px; padding: 4px;
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; user-select: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06); border: 2px solid transparent;
        }

        /* 學習模式下的 Hover 效果 */
        .mode-learn .element:hover {
            transform: scale(1.25) translateY(-5px); z-index: 20; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); border-color: #fff;
        }

        .element.dimmed { opacity: 0.2; filter: grayscale(80%); transform: scale(0.95); }
        .el-num { font-size: 11px; color: rgba(0,0,0,0.4); padding-left: 4px; font-weight: 800; }
        .el-sym { font-size: 22px; font-weight: 800; text-align: center; color: #333; height: 30px; display: flex; align-items: center; justify-content: center;}
        .el-name { font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; font-weight: bold; color: #555; padding-bottom: 2px;}

        /* 測驗 A 輸入框 */
        .quiz-input-a {
            width: 80%; height: 24px; text-align: center; font-size: 16px; font-weight: bold;
            border: 2px solid #ccc; border-radius: 6px; outline: none; text-transform: capitalize;
        }
        .quiz-input-a:focus { border-color: #4facfe; }
        .quiz-input-a.correct { background-color: var(--success); color: white; border-color: var(--success); }
        .quiz-input-a.wrong { background-color: var(--error); color: white; border-color: var(--error); }

        /* --- 5. 測驗 B 介面 --- */
        #test-b-container {
            display: none; flex-direction: column; align-items: center; gap: 20px;
            width: 100%; max-width: 600px; background: white; padding: 40px;
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-top: 20px;
        }
        .test-b-header { font-size: 1.5rem; font-weight: bold; color: #333; margin-bottom: 10px; }
        .quiz-b-item { display: flex; align-items: center; justify-content: space-between; width: 80%; background: #f8f9fa; padding: 15px 25px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; border: 2px solid #eee; }
        .quiz-b-input { width: 80px; font-size: 1.2rem; text-align: center; padding: 5px; border: 2px solid #ccc; border-radius: 8px; outline: none; }
        .submit-btn { background: var(--highlight); color: white; border: none; padding: 12px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4); transition: 0.2s; margin-top: 15px; }
        .submit-btn:hover { transform: scale(1.05); background: #ff758c; }
        .score-display { font-size: 1.5rem; font-weight: bold; color: var(--highlight); display: none; }

        /* --- 6. 預覽方框 --- */
        #preview-container { grid-column: 3 / 13; grid-row: 1 / 4; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 1; }
        #image-preview-box { width: 260px; height: 280px; background-color: #fff; border-radius: 16px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 15px; border: 4px solid #fff; }
        #preview-img-container { width: 100%; height: 180px; border-radius: 12px; background-color: #f0f0f0; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #preview-emoji { font-size: 60px; display: none; }
        #preview-text-info { margin-top: 15px; text-align: center; width: 100%; }
        #preview-label { font-size: 20px; font-weight: 800; color: #333; margin-bottom: 4px; }
        #preview-status { font-size: 13px; color: #888; }
        @media (max-width: 1100px) { #preview-container { display: none; } }

        /* --- 7. 馬卡龍分類顏色 --- */
        .cat-alkali-metal { background-color: #ffc8dd; } 
        .cat-alkaline-earth-metal { background-color: #ffcf99; } 
        .cat-transition-metal { background-color: #fcf6bd; } 
        .cat-post-transition-metal { background-color: #d0f4de; } 
        .cat-metalloid { background-color: #a9def9; } 
        .cat-polyatomic-nonmetal, .cat-diatomic-nonmetal, .cat-nonmetal { background-color: #bde0fe; } 
        .cat-noble-gas { background-color: #e4c1f9; } 
        .cat-lanthanide { background-color: #fcd5ce; } 
        .cat-actinide { background-color: #e8e8e4; } 
        .cat-unknown { background-color: #e9ecef; }

        /* --- 8. 完整 Modal 樣式 --- */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(240, 244, 248, 0.85); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(8px); }
        .modal.show { opacity: 1; }
        .modal-content { background-color: #fff; padding: 35px; border-radius: 24px; width: 90%; max-width: 550px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.05); }
        .close-btn { position: absolute; top: 15px; right: 25px; font-size: 32px; cursor: pointer; color: #ccc; transition: all 0.2s; font-weight: bold; }
        .close-btn:hover { color: var(--highlight); transform: rotate(90deg); }
        
        .modal-header { display: flex; align-items: center; gap: 25px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px dashed #eee; }
        .big-symbol { font-size: 65px; font-weight: 800; color: #333; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; border-radius: 20px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .modal-title h2 { margin: 0; font-size: 2.2rem; color: #333; }
        .modal-title span { color: var(--text-muted); font-size: 1.1rem; font-weight: bold;}
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .data-item { background: #f8f9fa; padding: 12px 15px; border-radius: 12px; border: 1px solid #eee; }
        .data-item strong { color: #888; font-size: 0.85rem; display: block; margin-bottom: 4px; }
        .data-item span { font-size: 1.1rem; font-weight: 800; color: #444;}
        
        .summary-box { background: #fff5f5; padding: 20px; border-radius: 16px; line-height: 1.7; color: #555; font-size: 1rem; max-height: 200px; overflow-y: auto; border-left: 5px solid var(--highlight); }
        .links-container { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .wiki-link, .video-btn { display: inline-flex; align-items: center; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-size: 0.95rem; font-weight: bold; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .wiki-link { background: #f0f4f8; color: #0077b6; }
        .wiki-link:hover { background: #e2eafc; transform: translateY(-2px); }
        .video-btn { background: #ff9a9e; color: white; display: none; }
        .video-btn:hover { background: #ff758c; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255, 117, 140, 0.3); }

        .loader { grid-column: 1 / -1; text-align: center; padding: 50px; color: #888; font-weight: bold; }
    </style>
</head>
<body class="mode-learn">

    <header>
        <div class="header-title">
            <h1>🧪 元素週期表</h1>
            <div class="author-badge">✨ 小粘製作</div>
        </div>
        
        <div class="mode-controls">
            <button id="btn-learn" class="mode-btn active" onclick="switchMode('LEARN')">📖 學習模式</button>
            <button id="btn-test-a" class="mode-btn" onclick="switchMode('TEST_A')">📝 測驗 A (符號填空)</button>
            <button id="btn-test-b" class="mode-btn" onclick="switchMode('TEST_B')">🏆 測驗 B (隨機五題)</button>
        </div>
    </header>

    <div class="table-wrapper">
        <!-- 週期表主體 -->
        <div class="periodic-table" id="periodic-table">
            <!-- 預覽框 -->
            <div id="preview-container">
                <div id="image-preview-box">
                    <div id="preview-img-container">
                        <img id="preview-img" src="" alt="">
                        <div id="preview-emoji">✨</div>
                    </div>
                    <div id="preview-text-info">
                        <div id="preview-label">把滑鼠移上來吧！</div>
                        <div id="preview-status">探索元素的長相 👀</div>
                    </div>
                </div>
            </div>
            <div class="loader">正在呼叫元素小精靈... 🪄</div>
        </div>

        <!-- 測驗 B 介面 -->
        <div id="test-b-container">
            <div class="test-b-header">測驗 B：化學符號大挑戰</div>
            <p style="color:#666; margin-top:0;">請根據下方中文名稱，填寫正確的化學符號 (注意大小寫)。</p>
            <div id="quiz-b-list" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;"></div>
            <button class="submit-btn" onclick="checkTestB()">送出批改 💯</button>
            <div id="score-b" class="score-display"></div>
            <button id="retry-b" class="mode-btn" style="display:none; margin-top:10px;" onclick="generateTestB()">再來一局 🔄</button>
        </div>
    </div>

    <!-- 完整的詳細資訊彈窗 ( Modal ) -->
    <div id="element-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-header">
                <div id="m-bg" class="big-symbol"></div>
                <div class="modal-title">
                    <h2 id="m-name"></h2>
                    <span id="m-en-name"></span><br>
                    <span id="m-category" style="color:#888; font-size:0.95rem;"></span>
                </div>
            </div>
            <div class="data-grid">
                <div class="data-item"><strong>🔢 原子序</strong><span id="m-number"></span></div>
                <div class="data-item"><strong>⚖️ 原子量</strong><span id="m-mass"></span></div>
                <div class="data-item"><strong>⚛️ 電子組態</strong><span id="m-shell"></span></div>
                <div class="data-item"><strong>🌡️ 相態 (常溫)</strong><span id="m-phase"></span></div>
            </div>
            <div class="summary-box">
                <strong style="display:block; margin-bottom:5px; color:#ff758c;">📖 簡介：</strong>
                <span id="m-summary">載入中...</span>
                <div class="links-container">
                    <a href="#" id="m-wiki" class="wiki-link" target="_blank">🌐 維基百科</a>
                    <!-- 1A族 專屬影片按鈕 -->
                    <a href="https://zh.wikipedia.org/wiki/File:Alkali_metals_reations.webm" id="m-video-btn" class="video-btn" target="_blank">🎥 遇水反應影片</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://raw.githubusercontent.com/Bowserinator/Periodic-Table-JSON/master/PeriodicTableJSON.json';
        const IMG_PROXY_BASE = 'https://images.weserv.nl/?url=images-of-elements.com/';

        // 快取維基百科資料
        const wikiCache = {};

        // 完整中英對照表
        const zhNames = {
            "Hydrogen": "氫", "Helium": "氦", "Lithium": "鋰", "Beryllium": "鈹", "Boron": "硼", 
            "Carbon": "碳", "Nitrogen": "氮", "Oxygen": "氧", "Fluorine": "氟", "Neon": "氖",
            "Sodium": "鈉", "Magnesium": "鎂", "Aluminium": "鋁", "Silicon": "矽", "Phosphorus": "磷", 
            "Sulfur": "硫", "Chlorine": "氯", "Argon": "氬", "Potassium": "鉀", "Calcium": "鈣",
            "Scandium": "鈧", "Titanium": "鈦", "Vanadium": "釩", "Chromium": "鉻", "Manganese": "錳", 
            "Iron": "鐵", "Cobalt": "鈷", "Nickel": "鎳", "Copper": "銅", "Zinc": "鋅",
            "Gallium": "鎵", "Germanium": "鍺", "Arsenic": "砷", "Selenium": "硒", "Bromine": "溴", 
            "Krypton": "氪", "Rubidium": "銣", "Strontium": "鍶", "Yttrium": "釔", "Zirconium": "鋯",
            "Niobium": "鈮", "Molybdenum": "鉬", "Technetium": "鎝", "Ruthenium": "釕", "Rhodium": "銠", 
            "Palladium": "鈀", "Silver": "銀", "Cadmium": "鎘", "Indium": "銦", "Tin": "錫",
            "Antimony": "銻", "Tellurium": "碲", "Iodine": "碘", "Xenon": "氙", "Cesium": "銫", 
            "Barium": "鋇", "Lanthanum": "鑭", "Cerium": "鈰", "Praseodymium": "鐠", "Neodymium": "釹",
            "Promethium": "鉕", "Samarium": "釤", "Europium": "銪", "Gadolinium": "釓", "Terbium": "鋱", 
            "Dysprosium": "鏑", "Holmium": "鈥", "Erbium": "鉺", "Thulium": "銩", "Ytterbium": "鐿",
            "Lutetium": "鎦", "Hafnium": "鉿", "Tantalum": "鉭", "Tungsten": "鎢", "Rhenium": "錸", 
            "Osmium": "鋨", "Iridium": "銥", "Platinum": "鉑", "Gold": "金", "Mercury": "汞",
            "Thallium": "鉈", "Lead": "鉛", "Bismuth": "鉍", "Polonium": "釙", "Astatine": "砈", 
            "Radon": "氡", "Francium": "鍅", "Radium": "鐳", "Actinium": "錒", "Thorium": "釷"
        };

        const categoryMap = {
            "alkali metal": "鹼金屬", "alkaline earth metal": "鹼土金屬", "transition metal": "過渡金屬",
            "post-transition metal": "貧金屬", "metalloid": "類金屬", "polyatomic nonmetal": "多原子非金屬",
            "diatomic nonmetal": "雙原子非金屬", "noble gas": "惰性氣體", "lanthanide": "鑭系元素",
            "actinide": "錒系元素", "unknown": "性質未知"
        };

        const phaseMap = { "Solid": "固體", "Liquid": "液體", "Gas": "氣體" };

        // 常考元素名單 (測驗A與B的範圍)
        const targetElements = [
            "H", "Li", "Na", "K", "Be", "Mg", "Ca", "Ba", 
            "Ti", "Cr", "Mn", "Fe", "Co", "Ni", "Cu", "Zn", "Ag", "Au", "Pt", "Hg", "W", 
            "B", "Al", "C", "Si", "Pb", "Sn", 
            "N", "P", "O", "S", 
            "F", "Cl", "Br", "I", 
            "He", "Ne", "Ar" 
        ];

        let allElementsData = [];
        let currentMode = 'LEARN'; 

        const tableContainer = document.getElementById('periodic-table');
        const modal = document.getElementById('element-modal');
        const previewImg = document.getElementById('preview-img');
        const previewEmoji = document.getElementById('preview-emoji');
        const previewLabel = document.getElementById('preview-label');
        const previewStatus = document.getElementById('preview-status');

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                allElementsData = data.elements;
                document.querySelector('.loader').style.display = 'none';
                renderTable();
            } catch (err) {
                console.error(err);
                document.querySelector('.loader').innerText = "載入失敗，請確認網路狀態。";
            }
        }

        // --- 渲染週期表 ---
        function renderTable() {
            // 清除除了 preview-container 以外的內容
            Array.from(tableContainer.children).forEach(child => {
                if(child.id !== 'preview-container' && !child.classList.contains('loader')) {
                    child.remove();
                }
            });

            allElementsData.forEach(el => {
                const div = document.createElement('div');
                div.className = 'element';
                
                let catClass = 'cat-' + (el.category || 'unknown').replace(/\s+/g, '-').toLowerCase();
                if(catClass.includes('nonmetal')) catClass = 'cat-nonmetal'; 
                div.classList.add(catClass);

                div.style.gridColumn = el.xpos;
                div.style.gridRow = el.ypos;
                
                const zhName = zhNames[el.name] || el.name;
                div.dataset.sym = el.symbol;
                div.dataset.zhName = zhName;

                // 根據模式決定內容
                if (currentMode === 'TEST_A' && targetElements.includes(el.symbol)) {
                    // 測驗 A 模式：指定元素變成輸入框
                    div.innerHTML = `
                        <span class="el-num">${el.number}</span>
                        <div class="el-sym"><input type="text" class="quiz-input-a" data-ans="${el.symbol}" maxlength="2" autocomplete="off"></div>
                        <span class="el-name">${zhName}</span>
                    `;
                    
                    const input = div.querySelector('.quiz-input-a');
                    input.addEventListener('input', function() {
                        const val = this.value.trim().toLowerCase();
                        const ans = this.dataset.ans.toLowerCase();
                        if (val === ans) {
                            this.classList.add('correct');
                            this.classList.remove('wrong');
                            this.disabled = true; 
                        } else if (val.length === ans.length) {
                            this.classList.add('wrong');
                            this.classList.remove('correct');
                        } else {
                            this.classList.remove('correct', 'wrong');
                        }
                    });

                } else {
                    // 一般學習模式 (或未被抽中的元素)
                    div.innerHTML = `
                        <span class="el-num">${el.number}</span>
                        <span class="el-sym">${el.symbol}</span>
                        <span class="el-name">${zhName}</span>
                    `;
                }

                // 綁定事件 (只有學習模式可以看資料和圖片預覽)
                if (currentMode === 'LEARN') {
                    div.addEventListener('mouseenter', () => handleHover(el, zhName));
                    div.onclick = () => openModal(el, catClass, zhName);
                }

                tableContainer.appendChild(div);
            });
        }

        // --- 模式切換邏輯 ---
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(mode === 'LEARN' ? 'btn-learn' : mode === 'TEST_A' ? 'btn-test-a' : 'btn-test-b').classList.add('active');

            const table = document.getElementById('periodic-table');
            const testB = document.getElementById('test-b-container');
            const preview = document.getElementById('preview-container');

            document.body.className = `mode-${mode.toLowerCase()}`;

            if (mode === 'LEARN') {
                table.style.display = 'grid'; testB.style.display = 'none'; preview.style.display = 'flex';
                renderTable();
            } 
            else if (mode === 'TEST_A') {
                table.style.display = 'grid'; testB.style.display = 'none'; preview.style.display = 'none'; 
                renderTable();
            } 
            else if (mode === 'TEST_B') {
                table.style.display = 'none'; testB.style.display = 'flex';
                generateTestB();
            }
        }

        // --- 滑鼠預覽 (學習模式) ---
        let currentHoverElement = null;
        async function fetchWikiData(zhName) {
            if (wikiCache[zhName]) return wikiCache[zhName];
            try {
                const wikiApi = `https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(zhName)}`;
                const res = await fetch(wikiApi);
                if (res.ok) {
                    const data = await res.json();
                    const result = {
                        summary: data.extract || "這個元素太神祕了，維基百科還在努力補充中！✨",
                        image: data.thumbnail ? data.thumbnail.source : null 
                    };
                    wikiCache[zhName] = result;
                    return result;
                }
            } catch (e) { console.error(e); }
            return { summary: "網路小精靈迷路了，無法載入資料 😢", image: null };
        }

        async function handleHover(el, zhName) {
            currentHoverElement = zhName;
            previewLabel.innerText = `${zhName} (${el.symbol})`;
            previewStatus.innerText = "搜尋圖片中... 📡";
            previewImg.style.display = 'none';
            previewEmoji.style.display = 'block';
            previewEmoji.innerText = "⏳";

            // 優先嘗試 Weserv 圖庫
            let nameForUrl = el.name.toLowerCase();
            if (nameForUrl === 'aluminum') nameForUrl = 'aluminium';
            if (nameForUrl === 'cesium') nameForUrl = 'caesium';
            const imgUrl = `${IMG_PROXY_BASE}${nameForUrl}.jpg`;

            let img = new Image();
            img.src = imgUrl;

            img.onload = () => {
                if (currentHoverElement === zhName) {
                    previewImg.src = imgUrl;
                    previewImg.style.display = 'block';
                    previewEmoji.style.display = 'none';
                    previewStatus.innerText = "✨ 找到真實照片了！";
                }
            };

            img.onerror = async () => {
                // 如果圖庫失敗，使用維基百科抓取
                const wikiData = await fetchWikiData(zhName);
                if (currentHoverElement === zhName) {
                    if (wikiData.image) {
                        previewImg.src = wikiData.image;
                        previewImg.style.display = 'block';
                        previewEmoji.style.display = 'none';
                        previewStatus.innerText = "✨ 來自維基百科的照片！";
                    } else {
                        previewImg.style.display = 'none';
                        previewEmoji.style.display = 'block';
                        previewEmoji.innerText = "🧪";
                        previewStatus.innerText = "暫無照片，給個試管吧！";
                    }
                }
            };
        }

        // --- 彈出視窗 (學習模式) ---
        async function openModal(el, colorClass, zhName) {
            document.getElementById('m-bg').innerText = el.symbol;
            document.getElementById('m-bg').className = `big-symbol ${colorClass}`;
            document.getElementById('m-name').innerText = zhName;
            document.getElementById('m-en-name').innerText = el.name;
            document.getElementById('m-category').innerText = categoryMap[el.category] || el.category;
            
            document.getElementById('m-number').innerText = el.number;
            document.getElementById('m-mass').innerText = el.atomic_mass;
            document.getElementById('m-shell').innerText = el.electron_configuration;
            document.getElementById('m-phase').innerText = phaseMap[el.phase] || el.phase;
            
            // 處理 1A 族影片按鈕
            const videoBtn = document.getElementById('m-video-btn');
            if (el.category.includes('alkali metal')) {
                videoBtn.style.display = 'inline-flex';
            } else {
                videoBtn.style.display = 'none';
            }

            const summaryEl = document.getElementById('m-summary');
            const wikiLink = document.getElementById('m-wiki');
            
            summaryEl.innerText = "正在翻閱百科全書... 📖";
            wikiLink.href = `https://zh.wikipedia.org/wiki/${zhName}`;
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);

            const wikiData = await fetchWikiData(zhName);
            summaryEl.innerText = wikiData.summary;
        }

        // --- 測驗 B：產生題目 ---
        function generateTestB() {
            const listDiv = document.getElementById('quiz-b-list');
            listDiv.innerHTML = ''; 
            document.getElementById('score-b').style.display = 'none';
            document.getElementById('retry-b').style.display = 'none';

            let shuffled = [...targetElements].sort(() => 0.5 - Math.random());
            let selectedSymbols = shuffled.slice(0, 5);

            selectedSymbols.forEach((sym, index) => {
                const elData = allElementsData.find(e => e.symbol === sym);
                const zhName = zhNames[elData.name] || elData.name;

                const item = document.createElement('div');
                item.className = 'quiz-b-item';
                item.innerHTML = `
                    <span>Q${index+1}. ${zhName}</span>
                    <input type="text" class="quiz-b-input" data-ans="${sym}" maxlength="2" autocomplete="off" placeholder="?">
                `;
                listDiv.appendChild(item);
            });
        }

        // --- 測驗 B：批改 ---
        function checkTestB() {
            const inputs = document.querySelectorAll('.quiz-b-input');
            let score = 0;

            inputs.forEach(input => {
                const val = input.value.trim().toLowerCase();
                const ans = input.dataset.ans.toLowerCase();

                if (val === ans) {
                    input.style.backgroundColor = 'var(--success)';
                    input.style.color = 'white';
                    input.style.borderColor = 'var(--success)';
                    score += 20;
                } else {
                    input.style.backgroundColor = 'var(--error)';
                    input.style.color = 'white';
                    input.style.borderColor = 'var(--error)';
                    input.value = `${input.value} (應為 ${input.dataset.ans})`;
                }
                input.disabled = true;
            });

            const scoreDisplay = document.getElementById('score-b');
            scoreDisplay.style.display = 'block';
            scoreDisplay.innerText = `你的分數：${score} 分！`;
            document.getElementById('retry-b').style.display = 'inline-block';
        }

        // 關閉 Modal
        const closeBtn = document.querySelector('.close-btn');
        closeBtn.onclick = () => {
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        };
        window.onclick = (e) => { if (e.target == modal) closeBtn.onclick(); }

        init();
    </script>
</body>
</html>
