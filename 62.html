<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙單擺互動模擬器</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
        }
        canvas {
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .controls-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            width: 800px;
        }
        .control-panel {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
        }
        .panel-a { border-top: 4px solid #e74c3c; }
        .panel-b { border-top: 4px solid #3498db; }
        
        .control-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .control-group label {
            font-size: 14px;
            color: #555;
            width: 100px;
        }
        .control-group input[type="range"] {
            flex: 1;
            margin: 0 10px;
        }
        .control-group span {
            width: 40px;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
        }
        .global-controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        button.reset-btn {
            background-color: #95a5a6;
        }
        button.reset-btn:hover {
            background-color: #7f8c8d;
        }
        .info-board {
            display: flex;
            justify-content: space-around;
            width: 800px;
            margin-top: 10px;
            font-size: 14px;
            color: #444;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>雙單擺互動模擬器</h1>
    
    <canvas id="simCanvas" width="800" height="400"></canvas>

    <div class="info-board">
        <div id="infoA">單擺A 理論週期: 0.00 秒</div>
        <div id="infoB">單擺B 理論週期: 0.00 秒</div>
    </div>

    <div class="global-controls">
        <button id="playPauseBtn">開始 / 暫停</button>
        <button id="resetBtn" class="reset-btn">重置 (回到初始角度)</button>
    </div>

    <div class="controls-container">
        <div class="control-panel panel-a">
            <h3 style="margin-top:0; color:#e74c3c;">單擺 A (紅色)</h3>
            <div class="control-group">
                <label>擺長 (cm)</label>
                <input type="range" id="lenA" min="50" max="300" value="150">
                <span id="valLenA">150</span>
            </div>
            <div class="control-group">
                <label>質量 (g)</label>
                <input type="range" id="massA" min="10" max="100" value="50">
                <span id="valMassA">50</span>
            </div>
            <div class="control-group">
                <label>初始角度 (°)</label>
                <input type="range" id="angleA" min="-90" max="90" value="20">
                <span id="valAngleA">20</span>
            </div>
        </div>

        <div class="control-panel panel-b">
            <h3 style="margin-top:0; color:#3498db;">單擺 B (藍色)</h3>
            <div class="control-group">
                <label>擺長 (cm)</label>
                <input type="range" id="lenB" min="50" max="300" value="100">
                <span id="valLenB">100</span>
            </div>
            <div class="control-group">
                <label>質量 (g)</label>
                <input type="range" id="massB" min="10" max="100" value="80">
                <span id="valMassB">80</span>
            </div>
            <div class="control-group">
                <label>初始角度 (°)</label>
                <input type="range" id="angleB" min="-90" max="90" value="-30">
                <span id="valAngleB">-30</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // 物理常數與時間設定
        const g = 980; // 重力加速度 (模擬用比例)
        const dt = 1 / 60; // 時間步長 (約 60fps)
        let isPlaying = false;
        let animationId;

        // 單擺物件類別
        class Pendulum {
            constructor(x, y, length, mass, angleDeg, color) {
                this.pivotX = x;
                this.pivotY = y;
                this.length = length;
                this.mass = mass;
                this.initialAngle = angleDeg * (Math.PI / 180);
                this.angle = this.initialAngle;
                this.angularVelocity = 0;
                this.color = color;
            }

            // 更新物理狀態 (Euler-Cromer 方法)
            update() {
                if (!isPlaying) return;
                // 角加速度: α = -(g/L) * sin(θ)
                const angularAcceleration = -(g / this.length) * Math.sin(this.angle);
                this.angularVelocity += angularAcceleration * dt;
                this.angle += this.angularVelocity * dt;
            }

            // 繪製單擺
            draw() {
                // 計算擺錘位置
                const bobX = this.pivotX + this.length * Math.sin(this.angle);
                const bobY = this.pivotY + this.length * Math.cos(this.angle);
                
                // 視覺半徑 (質量越大，圓越大，開根號讓視覺增長較平緩)
                const radius = Math.sqrt(this.mass) * 2;

                // 畫擺線
                ctx.beginPath();
                ctx.moveTo(this.pivotX, this.pivotY);
                ctx.lineTo(bobX, bobY);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 畫擺錘
                ctx.beginPath();
                ctx.arc(bobX, bobY, radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#222';
                ctx.stroke();
                
                // 畫懸掛點 (支點)
                ctx.beginPath();
                ctx.arc(this.pivotX, this.pivotY, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();
            }

            // 重置回初始狀態
            reset() {
                this.angle = this.initialAngle;
                this.angularVelocity = 0;
            }

            // 計算理論週期 (T = 2π√(L/g))
            getPeriod() {
                return 2 * Math.PI * Math.sqrt(this.length / g);
            }
        }

        // 建立兩個單擺 (A在左側，B在右側)
        let penA = new Pendulum(250, 50, 150, 50, 20, '#e74c3c');
        let penB = new Pendulum(550, 50, 100, 80, -30, '#3498db');

        // 綁定 UI 元素
        const ui = {
            lenA: document.getElementById('lenA'), valLenA: document.getElementById('valLenA'),
            massA: document.getElementById('massA'), valMassA: document.getElementById('valMassA'),
            angleA: document.getElementById('angleA'), valAngleA: document.getElementById('valAngleA'),
            lenB: document.getElementById('lenB'), valLenB: document.getElementById('valLenB'),
            massB: document.getElementById('massB'), valMassB: document.getElementById('valMassB'),
            angleB: document.getElementById('angleB'), valAngleB: document.getElementById('valAngleB'),
            infoA: document.getElementById('infoA'),
            infoB: document.getElementById('infoB')
        };

        // 更新資訊面板的理論週期
        function updateInfo() {
            ui.infoA.innerText = `單擺A 理論週期: ${penA.getPeriod().toFixed(2)} 秒`;
            ui.infoB.innerText = `單擺B 理論週期: ${penB.getPeriod().toFixed(2)} 秒`;
        }

        // 處理滑桿數值變更
        function setupInputs() {
            // 單擺 A
            ui.lenA.addEventListener('input', (e) => {
                penA.length = parseInt(e.target.value);
                ui.valLenA.innerText = penA.length;
                updateInfo();
                if (!isPlaying) drawFrame();
            });
            ui.massA.addEventListener('input', (e) => {
                penA.mass = parseInt(e.target.value);
                ui.valMassA.innerText = penA.mass;
                if (!isPlaying) drawFrame();
            });
            ui.angleA.addEventListener('input', (e) => {
                let deg = parseInt(e.target.value);
                penA.initialAngle = deg * (Math.PI / 180);
                ui.valAngleA.innerText = deg;
                penA.reset();
                if (!isPlaying) drawFrame();
            });

            // 單擺 B
            ui.lenB.addEventListener('input', (e) => {
                penB.length = parseInt(e.target.value);
                ui.valLenB.innerText = penB.length;
                updateInfo();
                if (!isPlaying) drawFrame();
            });
            ui.massB.addEventListener('input', (e) => {
                penB.mass = parseInt(e.target.value);
                ui.valMassB.innerText = penB.mass;
                if (!isPlaying) drawFrame();
            });
            ui.angleB.addEventListener('input', (e) => {
                let deg = parseInt(e.target.value);
                penB.initialAngle = deg * (Math.PI / 180);
                ui.valAngleB.innerText = deg;
                penB.reset();
                if (!isPlaying) drawFrame();
            });
        }

        // 按鈕事件
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            isPlaying = !isPlaying;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isPlaying = false;
            penA.reset();
            penB.reset();
            drawFrame();
        });

        // 繪製與動畫迴圈
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 畫基準虛線
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.lineTo(800, 50);
            ctx.strokeStyle = '#ddd';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]); // 恢復實線

            // 畫中心垂直輔助線
            ctx.beginPath();
            ctx.moveTo(250, 50); ctx.lineTo(250, 380);
            ctx.moveTo(550, 50); ctx.lineTo(550, 380);
            ctx.strokeStyle = '#eee';
            ctx.stroke();

            // 更新並繪製單擺
            penA.update();
            penA.draw();
            penB.update();
            penB.draw();
        }

        function loop() {
            drawFrame();
            requestAnimationFrame(loop);
        }

        // 初始化
        setupInputs();
        updateInfo();
        penA.reset();
        penB.reset();
        loop();
    </script>
</body>
</html>
